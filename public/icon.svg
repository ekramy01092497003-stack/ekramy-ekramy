<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF37C8"/>
      <stop offset="40%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-dasharray="16 12"/>

  <!-- Sound Waves (Left) -->
  <path d="M 120 220 Q 95 256 120 292" fill="none" stroke="#FDE047" stroke-width="12" stroke-linecap="round"/>
  <path d="M 90 190 Q 60 256 90 322" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- Sound Waves (Right) -->
  <path d="M 392 220 Q 417 256 392 292" fill="none" stroke="#FDE047" stroke-width="12" stroke-linecap="round"/>
  <path d="M 422 190 Q 452 256 422 322" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- Glowing Crown on top -->
  <path d="M 196 170 L 226 200 L 256 150 L 286 200 L 316 170 L 306 220 L 206 220 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="196" cy="165" r="8" fill="#FFF"/>
  <circle cx="256" cy="145" r="9" fill="#FFF"/>
  <circle cx="316" cy="165" r="8" fill="#FFF"/>

  <!-- Studio Microphone Capsule -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="220" y="220" width="72" height="120" rx="36" fill="#FFFFFF"/>
    <!-- Mic Grille Stripes -->
    <line x1="228" y1="245" x2="284" y2="245" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="228" y1="265" x2="284" y2="265" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="228" y1="285" x2="284" y2="285" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <!-- Mic Stand U-bracket -->
    <path d="M 200 270 C 200 360 312 360 312 270" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Mic Stand Stem -->
    <line x1="256" y1="335" x2="256" y2="390" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Mic Base -->
    <path d="M 216 390 L 296 390" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <polygon points="170,120 174,132 186,136 174,140 170,152 166,140 154,136 166,132" fill="#FDE047"/>
  <polygon points="340,110 343,120 353,123 343,126 340,136 337,126 327,123 337,120" fill="#FF37C8"/>
  <polygon points="360,370 363,380 373,383 363,386 360,396 357,386 347,383 357,380" fill="#FDE047"/>
</svg>
